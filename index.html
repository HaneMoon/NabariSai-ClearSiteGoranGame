<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>文化祭のやつ2025</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main-layout">
        <div id="video-container">
            <video id="video" playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="pose-guide-overlay"></div>
        </div>
        <div id="result-box">
            <p><span id="current-challenge-name">---</span></p>
            <p>現在のマッチング度:</p>
            <span id="match-score">14.5 % (平均)</span>
            <div id="timer-display">GO!</div>
            <div id="guide-message">
                **全チャレンジ完了！**...
            </div>
            <button id="debug-start-button" style="margin-top: 20px; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
                ▶️ チャレンジ強制スタート (DEBUG)
            </button>
        </div>
    </div>

     <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

    <script type="module" src="./script.js"></script>
</body>

</html>
